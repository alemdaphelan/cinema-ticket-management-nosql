services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinema-ticket-app
    container_name: cinema_nosql_app
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_KEY: ${APP_KEY:?Run scripts/nosql/init-env.ps1 to create APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cinema_ticket_management
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env or the selected env file}
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      CACHE_STORE: redis
      NOSQL_REDIS_CONNECTION: default
      NOSQL_REDIS_CACHE_STORE: redis
      NOSQL_REDIS_SEAT_HOLD_STORE: redis
      NOSQL_REDIS_LEADERBOARD_STORE: redis
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-cinema_content}
      MONGO_USERNAME: ${MONGO_APP_USERNAME:-cinema_app}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env or the selected env file}
      MONGO_AUTH_DATABASE: ${MONGO_DATABASE:-cinema_content}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:-cinema_app}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env or the selected env file}@mongodb:27017/${MONGO_DATABASE:-cinema_content}?authSource=${MONGO_DATABASE:-cinema_content}
      NOSQL_MONGODB_DRIVER: mongodb
      NOSQL_MONGODB_CONNECTION: mongodb
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-cinema_analytics}
      CASSANDRA_USERNAME: ${CASSANDRA_APP_USERNAME:-cinema_app}
      CASSANDRA_PASSWORD: ${CASSANDRA_APP_PASSWORD:?Set CASSANDRA_APP_PASSWORD in .env or the selected env file}
      CASSANDRA_API_URL: http://cassandra-api:8080
      NOSQL_CASSANDRA_DRIVER: http
      QUEUE_CONNECTION: database
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or the selected env file}
      NOSQL_NEO4J_DRIVER: http
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-api:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - cinema-network

  db:
    image: mysql:8.0
    container_name: cinema_nosql_db
    restart: unless-stopped
    command: --skip-name-resolve
    environment:
      MYSQL_DATABASE: cinema_ticket_management
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - cinema_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - cinema-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema_nosql_scheduler
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: sh -c "php artisan app:update-demo-shows && php artisan schedule:work"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_KEY: ${APP_KEY:?Run scripts/nosql/init-env.ps1 to create APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cinema_ticket_management
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env or the selected env file}
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      CACHE_STORE: redis
      NOSQL_REDIS_CONNECTION: default
      NOSQL_REDIS_CACHE_STORE: redis
      NOSQL_REDIS_SEAT_HOLD_STORE: redis
      NOSQL_REDIS_LEADERBOARD_STORE: redis
      MONGO_DATABASE: ${MONGO_DATABASE:-cinema_content}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:-cinema_app}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env or the selected env file}@mongodb:27017/${MONGO_DATABASE:-cinema_content}?authSource=${MONGO_DATABASE:-cinema_content}
      NOSQL_MONGODB_DRIVER: mongodb
      NOSQL_MONGODB_CONNECTION: mongodb
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or the selected env file}
      NOSQL_NEO4J_DRIVER: http
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - cinema-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinema-ticket-app
    container_name: cinema_worker
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: php artisan queue:work --queue=default --tries=5 --backoff=5 --timeout=60
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_KEY: ${APP_KEY:?Run scripts/nosql/init-env.ps1 to create APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cinema_ticket_management
      DB_USERNAME: root
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env or the selected env file}
      MONGO_DATABASE: ${MONGO_DATABASE:-cinema_content}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:-cinema_app}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env or the selected env file}@mongodb:27017/${MONGO_DATABASE:-cinema_content}?authSource=${MONGO_DATABASE:-cinema_content}
      NOSQL_MONGODB_DRIVER: mongodb
      NOSQL_MONGODB_CONNECTION: mongodb
      CASSANDRA_API_URL: http://cassandra-api:8080
      NOSQL_CASSANDRA_DRIVER: http
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-cinema_analytics}
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or the selected env file}
      NOSQL_NEO4J_DRIVER: http
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra-api:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - cinema-network

  mongodb:
    image: mongo:8.0
    container_name: cinema_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-cinema_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env or the selected env file}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-cinema_content}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-cinema_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env or the selected env file}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)\""]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    networks:
      - cinema-network

  redis:
    image: redis:7.4-alpine
    container_name: cinema_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env or the selected env file}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - cinema-network

  redis-init:
    image: redis:7.4-alpine
    container_name: cinema_redis_init
    restart: "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env or the selected env file}
    volumes:
      - ./docker/redis/init:/init:ro
    command: ["sh", "/init/01-seed.sh"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cinema-network

  cassandra:
    image: cassandra:5.0
    container_name: cinema_cassandra
    restart: unless-stopped
    entrypoint: ["bash", "/usr/local/bin/configure-and-run.sh"]
    command: ["cassandra", "-f"]
    environment:
      CASSANDRA_CLUSTER_NAME: cinema_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 200M
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./docker/cassandra/configure-and-run.sh:/usr/local/bin/configure-and-run.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -Eq '^UN[[:space:]]'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - cinema-network

  cassandra-init:
    image: cassandra:5.0
    container_name: cinema_cassandra_init
    restart: "no"
    environment:
      CASSANDRA_ADMIN_PASSWORD: ${CASSANDRA_ADMIN_PASSWORD:?Set CASSANDRA_ADMIN_PASSWORD in .env or the selected env file}
      CASSANDRA_APP_USERNAME: ${CASSANDRA_APP_USERNAME:-cinema_app}
      CASSANDRA_APP_PASSWORD: ${CASSANDRA_APP_PASSWORD:?Set CASSANDRA_APP_PASSWORD in .env or the selected env file}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-cinema_analytics}
    volumes:
      - ./docker/cassandra/init:/init:ro
    command: ["bash", "/init/run-init.sh"]
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - cinema-network

  cassandra-api:
    build:
      context: ./docker/cassandra-api
      dockerfile: Dockerfile
    image: cinema-cassandra-api
    container_name: cinema_cassandra_api
    restart: unless-stopped
    environment:
      PORT: 8080
      CASSANDRA_HOST: cassandra
      CASSANDRA_DC: datacenter1
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-cinema_analytics}
      CASSANDRA_USERNAME: ${CASSANDRA_APP_USERNAME:-cinema_app}
      CASSANDRA_PASSWORD: ${CASSANDRA_APP_PASSWORD:?Set CASSANDRA_APP_PASSWORD in .env or the selected env file}
    ports:
      - "127.0.0.1:9043:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - cinema-network

  neo4j:
    image: neo4j:5.26-community
    container_name: cinema_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or the selected env file}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a neo4j://127.0.0.1:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 40s
    networks:
      - cinema-network

  neo4j-init:
    image: neo4j:5.26-community
    container_name: cinema_neo4j_init
    restart: "no"
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or the selected env file}
    volumes:
      - ./docker/neo4j/init:/init:ro
    command: ["bash", "/init/run-init.sh"]
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - cinema-network

networks:
  cinema-network:
    name: cinema-network
    driver: bridge

volumes:
  cinema_db_data:
    name: cinema_db_data
  mongodb_data:
    name: cinema_mongodb_data
  redis_data:
    name: cinema_redis_data
  cassandra_data:
    name: cinema_cassandra_data
  neo4j_data:
    name: cinema_neo4j_data
  neo4j_logs:
    name: cinema_neo4j_logs
  vendor_data:
    name: cinema_vendor_data
